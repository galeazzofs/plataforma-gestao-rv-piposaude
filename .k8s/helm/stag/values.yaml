replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/plataforma-comissoes-backend
  tag: latest

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

nodeToRun: pipo-core-arm64

env:
  FLASK_ENV: stag
  CORS_ORIGINS: "https://comissoes-stag.piposaude.com"

secrets:
  DATABASE_URL: STAG_DATABASE_URL
  GOOGLE_CLIENT_ID: GOOGLE_CLIENT_ID
  GOOGLE_CLIENT_SECRET: GOOGLE_CLIENT_SECRET
  HUBSPOT_TOKEN: STAG_HUBSPOT_TOKEN
  SLACK_BOT_TOKEN: SLACK_BOT_TOKEN
  SECRET_KEY: STAG_SECRET_KEY

ingress:
  enabled: true
  host: comissoes-stag.piposaude.com
  tls: true

livenessProbe:
  httpGet:
    path: /health
    port: 8000

readinessProbe:
  httpGet:
    path: /ready
    port: 8000

tags:
  Squad: RevOps
  Domain: Comissoes
  Environment: stag
  Service: plataforma-comissoes
