stages:
  - test
  - lint
  - build
  - push
  - deploy

variables:
  AWS_REGION: us-east-1
  ECR_REPO: plataforma-comissoes-frontend
  HELM_RELEASE: plataforma-comissoes-frontend
  HELM_CHART: .k8s/helm

# ── Frontend ──────────────────────────────────────────────────────────────────

test-frontend:
  stage: test
  image: node:20-slim
  script:
    - cd frontend
    - yarn install --frozen-lockfile
    - yarn test
  only:
    - merge_requests
    - master
    - main

lint-frontend:
  stage: lint
  image: node:20-slim
  script:
    - cd frontend
    - yarn install --frozen-lockfile
    - yarn lint
  only:
    - merge_requests
    - master
    - main

build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $ECR_REPO:$CI_COMMIT_SHA ./frontend
  only:
    - master
    - main

push-frontend:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    - docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$CI_COMMIT_SHA ./frontend
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$CI_COMMIT_SHA
    - docker tag $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$CI_COMMIT_SHA $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest
  only:
    - master
    - main

deploy-frontend-stag:
  stage: deploy
  image: alpine/helm:3.15.0
  script:
    - helm upgrade --install $HELM_RELEASE $HELM_CHART
        --namespace comissoes-stag
        --create-namespace
        -f $HELM_CHART/stag/values-frontend.yaml
        --set image.tag=$CI_COMMIT_SHA
  environment:
    name: stag
    url: https://comissoes-stag.piposaude.com
  only:
    - master
    - main

deploy-frontend-prod:
  stage: deploy
  image: alpine/helm:3.15.0
  script:
    - helm upgrade --install $HELM_RELEASE $HELM_CHART
        --namespace comissoes-prod
        --create-namespace
        -f $HELM_CHART/prod/values-frontend.yaml
        --set image.tag=$CI_COMMIT_SHA
  environment:
    name: prod
    url: https://comissoes.piposaude.com
  when: manual
  only:
    - master
    - main
