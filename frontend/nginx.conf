server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defense-in-depth) ─────────────────────────────────
    # CSP: tokens currently live in the JS heap (re-frame app-db). Until they
    # move to HttpOnly cookies, a strict CSP is the strongest XSS mitigation.
    # 'unsafe-inline' for style-src is required because Reagent emits inline
    # :style maps everywhere; remove once those are migrated to classes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: only safe to enable behind a TLS-terminating proxy that always
    # serves HTTPS. The k8s ingress in /.k8s/helm should handle TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Allow large XLSX uploads (matches Flask MAX_CONTENT_LENGTH)
    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA shell — never cache so deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://plataforma-comissoes-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # JS/CSS bundles — short revalidation so cache-bust query string flips
    # take effect within a minute, but browsers can still cheaply 304 in
    # between. Pair with a content-hashed filename in shadow-cljs to flip
    # this to immutable + max-age=31536000 once available.
    location /js/ {
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
    }

    location /nginx-health {
        return 200 "ok";
    }
}